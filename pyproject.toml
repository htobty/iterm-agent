[project]
name = "iterm-agent"
version = "0.1.0"
description = "Intelligent terminal agent for iTerm2 with LLM-powered natural language commands"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
