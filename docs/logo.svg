<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141832"/>
    </linearGradient>

    <linearGradient id="chev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5c3"/>
      <stop offset="100%" stop-color="#00b4ff"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5c3"/>
      <stop offset="50%" stop-color="#00b4ff"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>

    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0  0 0.8 0 0 0.6  0 0 1 0 0  0 0 0 0.35 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Prompt chevron -->
  <path d="M 140 160 L 210 220 L 140 280" stroke="url(#chev)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Typing indicator: three dots (AI is thinking) -->
  <circle cx="270" cy="220" r="14" fill="#00e5c3" opacity="0.9" filter="url(#dotGlow)"/>
  <circle cx="320" cy="220" r="14" fill="#00b4ff" opacity="0.7" filter="url(#dotGlow)"/>
  <circle cx="370" cy="220" r="14" fill="#6c5ce7" opacity="0.5" filter="url(#dotGlow)"/>

  <!-- Text -->
  <text x="256" y="380" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="42" font-weight="600" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2" filter="url(#textGlow)">iTerm-Agent</text>

  <!-- Tagline -->
  <text x="256" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="300" fill="#4a5570" text-anchor="middle" letter-spacing="4">TERMINAL × AI</text>
</svg>
